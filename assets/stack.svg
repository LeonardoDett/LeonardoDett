    <text x="30" y="201" fill="#EADCC8" fill-opacity=".8" font-size="19">Clear boundaries. Explicit contracts.</text>
    <text x="30" y="229" fill="#EADCC8" fill-opacity=".8" font-size="19">Systems designed to evolve.</text>
