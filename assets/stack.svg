<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="704" viewBox="0 0 1184 704" fill="none" role="img" aria-labelledby="stack-title stack-desc"><title id="stack-title">Systems Architecture, Golang, TypeScript and DevOps</title><desc id="stack-desc">Four custom expertise cards with 64-pixel spacing, using the orange, magenta, cyan, dark and warm ivory palette.</desc><svg x="0" y="0" xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" fill="none" role="img" aria-labelledby="architecture-title architecture-desc">
